[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fidelity-control-center"
version = "1.0.0"
description = "Quantitative Control Center for Fidelity Investors: Extremizing Indicators, Sentiment, Munger Gating, and Daily Orders"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2.36",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "openpyxl>=3.1.0",
    "matplotlib>=3.10.9",
]

[project.scripts]
fidelity-control = "fidelity_control.cli:main"
